<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>/photography/streetphotography - Nguyễn Chi Lan</title>

  <!-- Google Fonts: Libre Caslon Text & Pinyon Script -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       /PHOTOGRAPHY/STREET PHOTOGRAPHY - EXACT FIGMA SPECIFICATION (Scale 0.75)
       ========================================================================== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background-color: #FDF6E6;
      color: #000000;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* Fluid Canvas Container */
    .viewport-canvas {
      position: relative;
      width: 100%;
      max-width: 1440px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: #FDF6E6;
      padding: 30.11px clamp(20px, 4.5vw, 75px) 40px clamp(20px, 4.5vw, 75px);
      display: flex;
      box-sizing: border-box;
    }

    /* --------------------------------------------------------------------------
       SIDEBAR NAVIGATION
       -------------------------------------------------------------------------- */
    .sidebar-nav {
      width: 180px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 5.25px;
      margin-top: 23px;
    }

    .nav-link {
      display: block;
      font-family: 'Libre Caslon Text', Georgia, serif;
      font-weight: 700;
      font-size: 15.75px;
      line-height: 15.75px;
      color: #BEBEBE;
      text-decoration: none;
      transition: color 0.2s ease, transform 0.15s ease;
      white-space: nowrap;
    }

    .nav-link:hover {
      color: #585858;
      transform: translateX(2px);
    }

    .nav-link.active {
      color: #585858;
      cursor: default;
      pointer-events: none;
    }

    /* --------------------------------------------------------------------------
       MAIN CONTENT COLUMN
       -------------------------------------------------------------------------- */
    .main-content {
      flex: 1 1 0;
      min-width: 0;
      width: 100%;
      max-width: 1072.5px;
      margin-left: clamp(20px, 2.5vw, 37.5px);
    }

    /* Top Breadcrumb with Back Arrow */
    .header-breadcrumb {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12.38px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      color: #9E9E9E;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .back-btn:hover {
      opacity: 0.7;
      transform: translateX(-3px);
    }

    .back-arrow-icon {
      width: 20.47px;
      height: 9.39px;
      display: block;
    }

    .breadcrumb-text {
      font-family: 'Libre Caslon Text', Georgia, serif;
      font-weight: 400;
      font-size: 15px;
      line-height: 21px;
      color: #9E9E9E;
      user-select: none;
    }

    /* --------------------------------------------------------------------------
       FULL IMAGE SHOWCASE WITH INSIDE EDGE ARROWS
       -------------------------------------------------------------------------- */
    .showcase-container {
      position: relative;
      width: 100%;
      max-width: 1072.5px;
      aspect-ratio: 1430 / 955.2;
      overflow: hidden;
      background-color: #000000;
    }

    .showcase-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      z-index: 1;
    }

    .showcase-slide.active {
      opacity: 1;
      visibility: visible;
      z-index: 2;
    }

    .showcase-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Edge navigation arrows inside image frame (Frame 3 / Frame 4 from Figma) */
    .nav-edge-arrow {
      position: absolute;
      top: 0;
      bottom: 0;
      width: clamp(50px, 13.5vw, 144.69px);
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      outline: none;
      transition: background 0.25s ease;
    }

    .nav-edge-arrow.arrow-left {
      left: 0;
    }

    .nav-edge-arrow.arrow-right {
      right: 0;
    }

    .frame-arrow-svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.4));
    }

    .arrow-shape {
      opacity: 0.9;
      transition: opacity 0.2s ease;
    }

    .nav-edge-arrow.arrow-left:hover {
      background: linear-gradient(to right, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 100%);
    }

    .nav-edge-arrow.arrow-right:hover {
      background: linear-gradient(to left, rgba(0, 0, 0, 0.6) 0%, rgba(0, 0, 0, 0) 100%);
    }

    .nav-edge-arrow:hover .arrow-shape {
      opacity: 1;
    }

    @media (max-width: 880px) {
      .viewport-canvas {
        flex-direction: column;
        padding: 24px 20px 48px;
      }

      .sidebar-nav {
        width: 100%;
        margin-top: 0;
        margin-bottom: 24px;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 10px 18px;
      }

      .main-content {
        margin-left: 0;
        width: 100%;
        max-width: 100%;
      }
    }

    @media (max-width: 600px) {
      .viewport-canvas {
        padding: 16px 14px 36px;
      }

      .sidebar-nav {
        gap: 8px 12px;
      }
    }
  </style>
</head>
<body>

  <div class="viewport-canvas">

    <!-- Sidebar Navigation -->
    <nav class="sidebar-nav" aria-label="Main Navigation">
      <a href="../../index.html" class="nav-link">/homepage</a>
      <a href="../index.html" class="nav-link active" aria-current="page">/photography</a>
      <a href="../../filmmaking/index.html" class="nav-link">/filmaking</a>
      <a href="../../music/index.html" class="nav-link">/music</a>
      <a href="../../dance-performance/index.html" class="nav-link">/dance&amp;performance</a>
      <a href="../../art/index.html" class="nav-link">/art</a>
      <a href="../../community/index.html" class="nav-link">/community</a>
    </nav>

    <!-- Main Content -->
    <main class="main-content">

      <!-- Header: Back Arrow + Breadcrumb -->
      <div class="header-breadcrumb">
        <a href="../index.html" class="back-btn" title="Back to /photography">
          <svg class="back-arrow-icon" viewBox="0 0 28 13" fill="none">
            <path d="M10.8457 4.54004H27.291V7.98242H10.8457V12.5225L0 6.26172L10.8457 0V4.54004Z" fill="#9E9E9E"/>
          </svg>
        </a>
        <div class="breadcrumb-text">/photography/streetphotography</div>
      </div>

      <!-- Full-Width Image Showcase with Edge Navigation Arrows inside image -->
      <div class="showcase-container">
        
        <!-- Left Arrow Button (Frame 4) -->
        <button class="nav-edge-arrow arrow-left" id="prev-btn" title="Previous photo" aria-label="Previous photo">
          <svg class="frame-arrow-svg" viewBox="0 0 193 952" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="arrow-shape" d="M67.6624 476L110.919 451.026L110.919 500.974L67.6624 476Z" fill="white" fill-opacity="0.9"/>
          </svg>
        </button>

        <!-- Carousel Images -->
        <div class="showcase-slide active" data-index="0">
          <img src="../../assets/photography/street_photo.jpg" alt="Street photography - DSC06084 1" class="showcase-image">
        </div>
        <div class="showcase-slide" data-index="1">
          <img src="../../assets/photography/street_2.jpg" alt="Street photography - DSC06043 1" class="showcase-image">
        </div>
        <div class="showcase-slide" data-index="2">
          <img src="../../assets/photography/street_3.jpg" alt="Street photography - DSC06048 1" class="showcase-image">
        </div>
        <div class="showcase-slide" data-index="3">
          <img src="../../assets/photography/street_4.jpg" alt="Street photography - DSC06102 1" class="showcase-image">
        </div>

        <!-- Right Arrow Button (Frame 3) -->
        <button class="nav-edge-arrow arrow-right" id="next-btn" title="Next photo" aria-label="Next photo">
          <svg class="frame-arrow-svg" viewBox="0 0 193 952" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path class="arrow-shape" d="M125.338 476L82.0811 500.974L82.0811 451.026L125.338 476Z" fill="white" fill-opacity="0.9"/>
          </svg>
        </button>

      </div>

    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const slides = document.querySelectorAll('.showcase-slide');
      const prevBtn = document.getElementById('prev-btn');
      const nextBtn = document.getElementById('next-btn');
      let currentIndex = 0;
      const totalSlides = slides.length;

      function showSlide(index) {
        if (totalSlides === 0) return;
        currentIndex = (index + totalSlides) % totalSlides;
        slides.forEach((slide, idx) => {
          if (idx === currentIndex) {
            slide.classList.add('active');
          } else {
            slide.classList.remove('active');
          }
        });
      }

      function nextSlide() {
        showSlide(currentIndex + 1);
      }

      function prevSlide() {
        showSlide(currentIndex - 1);
      }

      if (prevBtn) {
        prevBtn.addEventListener('click', (e) => {
          e.preventDefault();
          prevSlide();
        });
      }

      if (nextBtn) {
        nextBtn.addEventListener('click', (e) => {
          e.preventDefault();
          nextSlide();
        });
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') nextSlide();
        if (e.key === 'ArrowLeft') prevSlide();
      });
    });
  </script>

</body>
</html>
