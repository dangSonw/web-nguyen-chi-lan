      border: none;

      display: flex;

      justify-content: center;
      text-decoration: none;
      transition: all 0.25s ease;

      color: #CD6E49;

      display: flex;

    }

    .portrait-photo {
      position: absolute;
      top: 0;
      left: 0;

      height: 100%;
      object-fit: cover;
      opacity: 0;
      visibility: hidden;

    .portrait-photo.active {
      opacity: 1;
      visibility: visible;

    .nav-arrow-zone {

    }

    .nav-arrow-left:hover {

    .nav-arrow-right {

    }

    .nav-arrow-right:hover {
      opacity: 1;

    .arrow-triangle-icon {

      height: 37px;
      display: block;
      transition: transform 0.25s ease;
    }

    .nav-arrow-zone:hover .arrow-triangle-icon {

    }

  <script>
    /**
     * Infinite looping carousel across the 8 photos of component 'portrait 2'
     */
    const totalPhotos = 8;
    let currentPhotoIndex = 1;

    function showPhoto(index) {
      currentPhotoIndex = index;
      for (let i = 1; i <= totalPhotos; i++) {
        const photo = document.getElementById('photo-' + i);
        if (photo) {
          if (i === currentPhotoIndex) {
            photo.classList.add('active');
          } else {
            photo.classList.remove('active');
          }
        }
      }
    }

    function nextPhoto() {
      let next = currentPhotoIndex + 1;
      if (next > totalPhotos) next = 1;
      showPhoto(next);
    }

    function prevPhoto() {
      let prev = currentPhotoIndex - 1;
      if (prev < 1) prev = totalPhotos;
      showPhoto(prev);
    }

    // Keyboard Arrow Left/Right support
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') nextPhoto();
      if (e.key === 'ArrowLeft') prevPhoto();
    });
  </script>
